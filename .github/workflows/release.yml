name: Android Release

# Signed APKs are built and device-tested locally before upload.
# Check the published assets without requiring desktop signing or cloud secrets.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published Android release tag to verify
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Android release assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download published release assets
        run: |
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx false
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/android-release" \
            --pattern '*.apk' --pattern '*.apk.sha256' \
            --pattern '*-source.tar.gz' --pattern 'release.json'
      - name: Verify APK, bundled inputs, and corresponding source
        run: |
          python3 .github/scripts/verify-android-release.py \
            --tag "$RELEASE_TAG" --directory "$RUNNER_TEMP/android-release"
          printf 'Verified Android release `%s`: APK checksum, bundled inputs, and source version.\n' \
            "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
